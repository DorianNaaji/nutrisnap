<div class="scanner-container">
  <div class="camera-preview">
    <video #video autoplay playsinline></video>
    <div class="scanner-controls">
      <button mat-fab color="primary" class="capture-btn" (click)="capture()">
        <mat-icon>camera_alt</mat-icon>
      </button>
      <button mat-icon-button class="gallery-btn" (click)="fileInput.click()">
        <mat-icon>photo_library</mat-icon>
      </button>
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" multiple hidden>
    </div>
  </div>

  <div class="gallery" *ngIf="capturedImages().length > 0">
    <div *ngFor="let img of capturedImages(); let i = index" class="thumb">
      <img [src]="img" />
      <button mat-icon-button (click)="removeImage(i)"><mat-icon>close</mat-icon></button>
    </div>
  </div>

  <form [formGroup]="scannerForm" class="scanner-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type de repas</mat-label>
      <mat-select formControlName="mealType">
        <mat-option value="petit-déjeuner">Petit-déjeuner</mat-option>
        <mat-option value="déjeuner">Déjeuner</mat-option>
        <mat-option value="dîner">Dîner</mat-option>
        <mat-option value="collation">Collation</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description (optionnel)</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <div *ngIf="errorMessage()" class="error-banner">
      {{ errorMessage() }}
    </div>

    <button mat-flat-button color="primary" class="submit-btn" (click)="submit()" [disabled]="isLoading()">
      <mat-spinner diameter="20" *ngIf="isLoading()"></mat-spinner>
      <span *ngIf="!isLoading()">Analyser le repas</span>
    </button>
  </form>
</div>
